spring:
  application:
    name: ams-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ams_db}
    username: ${DB_USERNAME:ams_user}
    password: ${DB_PASSWORD:ams_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-production}
  expiration: 86400000  # 24h in ms

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:swd_g1_asm}
  api-key: ${CLOUDINARY_API_KEY:515266116764594}
