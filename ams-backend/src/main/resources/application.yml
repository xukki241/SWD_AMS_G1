spring:
  application:
    name: ams-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ams_db}
    username: ${DB_USERNAME:ams_user}
    password: ${DB_PASSWORD:ams_password}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-production}
  expiration: 86400000  # 24h in ms

app:
  web-url: ${APP_WEB_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@ams.local}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay-ipn}

sepay:
  env: ${SEPAY_ENV:production}
  merchant-id: ${SEPAY_MERCHANT_ID:}
  secret-key: ${SEPAY_SECRET_KEY:}
  success-url: ${SEPAY_SUCCESS_URL:http://localhost:3000/payment/sepay-return}
  error-url: ${SEPAY_ERROR_URL:http://localhost:3000/payment/sepay-return?result=error}
  cancel-url: ${SEPAY_CANCEL_URL:http://localhost:3000/payment/sepay-return?result=cancel}
  ipn-url: ${SEPAY_IPN_URL:http://localhost:8080/api/payment/sepay-ipn}
  # BANK_TRANSFER | NAPAS_BANK_TRANSFER | CARD — leave empty to omit (merchant default).
  payment-method: ${SEPAY_PAYMENT_METHOD:BANK_TRANSFER}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/payos-return}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/payos-return}

# Local disk storage for class materials / uploads (override via FILE_STORAGE_*)
file:
  storage:
    path: ${FILE_STORAGE_PATH:./storage/files}
    base-url: ${FILE_STORAGE_BASE_URL:http://localhost:8080}

# Gemini AI (course outline generation). Never hardcode the key.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ams: DEBUG
    org.springframework.security: INFO
