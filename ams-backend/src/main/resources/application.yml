# Local disk storage for class materials / uploads (override via FILE_STORAGE_*)
file:
  storage:
    path: ${FILE_STORAGE_PATH:./storage/files}
    base-url: ${FILE_STORAGE_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ams: DEBUG
    org.springframework.security: INFO
