spring:
  application:
    name: ams-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ams_db}
    username: ${DB_USERNAME:ams_user}
    password: ${DB_PASSWORD:ams_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-production}
  expiration: 86400000  # 24h in ms

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:swd_g1_asm}
  api-key: ${CLOUDINARY_API_KEY:515266116764594}
  api-secret: ${CLOUDINARY_API_SECRET:zpX4FsnjTXRtK8p5BxzI3YQFnFY}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:K815KFV6}
  hash-secret: ${VNPAY_HASH_SECRET:XXRGOEBAEHIDULXFAPHQLAYVHAZEBEKC}
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay-ipn}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ams: DEBUG
    org.springframework.security: INFO
